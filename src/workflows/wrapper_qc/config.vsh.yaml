name: wrapper_qc
namespace: workflows
description: A wrapper for generate_qc_report
authors:
  - __merge__: /src/authors/jakub_majercik.yaml
    roles: [author]
argument_groups:
  - name: Inputs
    arguments:
      - name: --id
        type: string
        required: false
        direction: input
        description: |
          The sample IDs to include in the report. If not provided,
          the sample IDs will be extracted from the h5mu files.
        example: sample1
      - name: --input
        type: file
        required: true
        direction: input
        description: The input h5mu files.
        example: path/to/file1.h5mu
      - name: --ingestion_method
        type: string
        required: true
        choices:
          - cellranger_multi
          - xenium
          - cosmx
      - name: --sample_metadata
        type: file
        required: false
        direction: input
        description: |
          The sample metadata file corresponding to .obs fields in the h5mu input files, to be used for grouping in the report.
        example: path/to/file.csv
  - name: Options
    arguments:
      - name: "--var_gene_names"
        example: "gene_symbol"
        type: string
        description: |
          The column name in the .var h5mu files that contains the gene names. If not provided, .var_names will be used.
      - name: --obs_metadata
        type: string
        multiple: true
        description: The metadata keys in the h5mu .obs to include in the report.
        example: [donor_id, cell_type, batch, condition]
  - name: Outputs
    arguments:
      - name: --output_qc_report
        type: file
        required: true
        multiple: true
        direction: output
        description: The output HTML report
        example: path/to/file.html
      - name: --output_processed_h5mu
        type: file
        required: true
        direction: output
        description: Folder containing the processed h5mu files.
        default: qc_h5mu

resources:
  - type: nextflow_script
    entrypoint: run_wf
    path: main.nf

test_resources:
  - type: nextflow_script
    path: test.nf
    entrypoint: test_xenium

dependencies:
  - name: workflows/generate_qc_report
    repository: openpipeline_qc

repositories:
  - name: openpipeline_qc
    repo: openpipeline_qc
    type: vsh
    tag: v0.2.2

runners:
  - type: nextflow
